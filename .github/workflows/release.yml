name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Check LivelyProperties.json sync
        run: npm run sync:check

      - name: Build
        run: npm run build

      - name: Zip dist
        run: |
          cd dist
          zip -r ascii-3d-wallpaper.zip . -x "ascii-3d-wallpaper.zip"
          ls -lh ascii-3d-wallpaper.zip
          unzip -l ascii-3d-wallpaper.zip | head -n 40

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ascii-3d-wallpaper
          path: dist/ascii-3d-wallpaper.zip
          if-no-files-found: error

      # Only create a GitHub Release when triggered by a tag (v1.0.0)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ascii-3d-wallpaper.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
